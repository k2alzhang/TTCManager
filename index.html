<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <title>MC 服务器管理</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <span class="icon" id="logo-icon"></span>
        <span class="name">服务器列表</span>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="add-server">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          添加服务器
        </button>
      </div>
    </header>
    <div class="app-body">
      <main class="main">
        <div class="page-head">
          <h1 class="page-title">我的服务器</h1>
          <p class="muted">选择一个服务器进入管理后台，或直接启动 / 关闭 / 重启。</p>
        </div>
        <div id="server-grid" class="server-grid"></div>
      </main>
    </div>
  </div>
  <style>
    .page-head {
      margin-bottom: 20px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .server-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .server-card {
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .server-card:hover {
      border-color: rgba(34, 197, 94, 0.5);
      background: rgba(27, 35, 54, 0.85);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(2, 6, 23, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .server-card .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .server-card .name {
      font-size: 16px;
      font-weight: 600;
    }
    .server-card .meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12.5px;
      color: var(--color-muted-foreground);
    }
    .server-card .meta .m-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .server-card .meta svg {
      width: 14px;
      height: 14px;
      opacity: 0.75;
    }
    .server-card .actions {
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding-top: 14px;
    }
    .server-card .actions .btn {
      flex: 1;
    }
  </style>
  <script src="js/effects.js"></script>
  <script src="js/servers.js"></script>
</body>
</html>
