<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.modrinth.com" />
  <title>下载模组 / 插件</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <a class="back" href="admin.html" aria-label="返回管理后台">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <span class="name">下载模组 / 插件</span>
      </div>
    </header>

    <div class="app-body">
      <main class="main add-main">
        <div class="tabs anim-in" id="source-tabs" role="tablist" aria-label="搜索源">
          <button class="tab active" data-src="modrinth" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><circle cx="12" cy="12" r="3"/></svg>
            Modrinth
          </button>
        </div>

        <div class="search-bar anim-in" style="--d:.06s">
          <input class="text-input" id="mod-search" type="search" placeholder="搜索模组或插件名称…" aria-label="搜索模组或插件" />
          <button class="btn btn-success" id="mod-search-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            搜索
          </button>
        </div>

        <p class="muted src-note" id="src-note">来源：Modrinth（实时自动搜索，点击安装自动添加到插件列表）</p>

        <div class="results" id="results">
          <div class="result-empty muted" id="result-empty">输入关键词搜索 Modrinth，例如 "LuckPerms"、"WorldEdit"。</div>
        </div>
      </main>
    </div>
  </div>

  <style>
    .back { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; color: var(--color-muted-foreground); transition: background 0.2s ease, color 0.2s ease; }
    .back:hover { background: rgba(255, 255, 255, 0.06); color: var(--color-card-foreground); }
    .back svg { width: 18px; height: 18px; }
    .add-main { max-width: 820px; margin: 0 auto; }
    .tabs { display: flex; gap: 8px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); padding: 5px; border-radius: 12px; margin-bottom: 16px; }
    .tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px; border-radius: 9px; color: var(--color-muted-foreground); font-size: 14px; font-weight: 500; transition: background 0.2s ease, color 0.2s ease; }
    .tab svg { width: 16px; height: 16px; }
    .tab.active { background: rgba(34, 197, 94, 0.16); color: #4ADE80; }
    .tab:disabled { opacity: 0.5; cursor: not-allowed; }
    .src-soon { font-size: 11px; opacity: 0.7; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-bar .text-input { flex: 1; }
    .src-note { font-size: 12px; margin-bottom: 16px; }
    .results { display: flex; flex-direction: column; gap: 12px; }
    .result-empty { text-align: center; padding: 40px; }
    .result-card { display: flex; align-items: center; gap: 14px; }
    .result-card .r-icon { width: 42px; height: 42px; border-radius: 9px; overflow: hidden; flex-shrink: 0; background: rgba(255, 255, 255, 0.05); }
    .result-card .r-icon img { width: 100%; height: 100%; object-fit: cover; }
    .result-card .r-icon .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--color-muted-foreground); }
    .result-card .r-main { flex: 1; min-width: 0; }
    .result-card .r-name { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
    .result-card .r-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result-card .r-author { font-size: 12.5px; color: var(--color-muted-foreground); }
    .result-card .r-desc { font-size: 12.5px; color: var(--color-muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 460px; }
    .result-card .r-meta { font-size: 11.5px; color: var(--color-muted-foreground); font-family: var(--font-mono); }
    .result-card .btn { flex-shrink: 0; }
    .loading { text-align: center; padding: 30px; color: var(--color-muted-foreground); }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(34, 197, 94, 0.16); border: 1px solid rgba(34, 197, 94, 0.5); color: #4ADE80;
      padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 80;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.5);
    }
    .toast.hidden { display: none; }
    @media (max-width: 700px) {
      .result-card .r-desc { max-width: 200px; }
    }
  </style>

  <script src="js/effects.js"></script>
  <script src="js/mod-download.js"></script>
</body>
</html>
