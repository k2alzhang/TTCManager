<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务器管理后台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <span class="icon" id="logo-icon"></span>
        <span class="name" id="server-name" contenteditable="true" spellcheck="false">我的服务器</span>
      </div>
      <div class="topbar-actions" id="server-actions">
        <button class="btn btn-success" data-ctl="start" aria-label="开启服务器"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span>开启服务器</span></button>
        <button class="btn btn-warn" data-ctl="stop" aria-label="关闭服务器"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg><span>关闭服务器</span></button>
        <button class="btn btn-danger" data-ctl="kill" aria-label="强制终止服务器"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg><span>强制终止</span></button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar">
        <div class="sidebar-label">功能区</div>
        <div class="nav-item active" data-view="home" role="button" tabindex="0" aria-label="首页">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
          首页
        </div>
        <div class="nav-item" data-view="files" role="button" tabindex="0" aria-label="文件管理">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          文件管理
        </div>
        <div class="nav-item" data-view="mods" role="button" tabindex="0" aria-label="模组和插件管理">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
          模组/插件管理
        </div>
        <div class="nav-item" data-view="players" role="button" tabindex="0" aria-label="玩家列表管理">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          玩家列表管理
        </div>
      </aside>

      <section class="terminal-col">
        <div class="terminal-head">
          <span class="dot"></span>
          <span class="terminal-title">控制台日志</span>
          <span class="terminal-status mono" id="term-status">运行中</span>
        </div>
        <div class="terminal" id="terminal" aria-live="polite"></div>
        <div class="cmd-bar">
          <span class="cmd-prompt mono">></span>
          <input id="cmd-input" class="cmd-input mono" type="text" placeholder="输入服务器指令，回车发送…" autocomplete="off" spellcheck="false" aria-label="服务器指令输入框" />
        </div>
      </section>

      <main class="main">
        <div class="view" data-pane="home">
          <div class="pane-head">
            <h1 class="pane-title">实时监控</h1>
            <p class="muted">服务器运行状态实时更新，每 1 秒刷新。</p>
          </div>
          <div class="metrics" id="metrics"></div>
          <div class="props" id="props"></div>
        </div>

        <div class="view" data-pane="files" hidden>
          <div class="pane-head">
            <h1 class="pane-title">文件管理</h1>
            <p class="muted">管理服务器文件：编辑、上传、下载、压缩、属性与权限。</p>
          </div>
          <div class="fm-toolbar">
            <nav class="fm-breadcrumb" id="fm-breadcrumb" aria-label="文件路径"></nav>
            <div class="fm-actions">
              <button class="btn" id="fm-upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg><span>上传文件</span></button>
              <button class="btn" id="fm-newfolder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6M9 14h6"/></svg><span>新建文件夹</span></button>
              <input type="file" id="fm-file-input" multiple hidden />
            </div>
          </div>
          <div class="card fm-list-wrap">
            <table class="fm-table">
              <thead>
                <tr><th>名称</th><th>大小</th><th>创建时间</th><th>权限</th><th class="fm-ops-th">操作</th></tr>
              </thead>
              <tbody id="fm-body"></tbody>
            </table>
            <div class="fm-empty muted" id="fm-empty" hidden>此文件夹为空。</div>
          </div>
        </div>
        <div class="view placeholder" data-pane="mods" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <h2>模组/插件管理</h2>
          <p class="muted">此页面将在后续迭代中实现。</p>
        </div>
        <div class="view placeholder" data-pane="players" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <h2>玩家列表管理</h2>
          <p class="muted">此页面将在后续迭代中实现。</p>
        </div>
      </main>
    </div>
  </div>

  <style>
    .app-body { position: relative; }
    .view[hidden] { display: none !important; }
    .terminal-col {
      width: 500px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--color-border);
      background: rgba(11, 17, 32, 0.45);
      min-height: 0;
    }
    .terminal-head {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 13px;
      font-weight: 500;
    }
    .terminal-head .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-accent);
      box-shadow: 0 0 8px var(--color-accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .terminal-title { flex: 1; }
    .terminal-status { font-size: 11.5px; color: var(--color-muted-foreground); }
    .terminal {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.7;
      color: #CBD5E1;
      min-height: 0;
    }
    .terminal .line { white-space: pre-wrap; word-break: break-all; }
    .terminal .line .t { color: var(--color-muted-foreground); }
    .terminal .line.info { color: #7DD3FC; }
    .terminal .line.warn { color: #FBBF24; }
    .terminal .line.error { color: #F87171; }
    .terminal .line.cmd { color: #F8FAFC; }
    .terminal .line.cmd .p { color: var(--color-accent); }
    .cmd-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding: 0 16px;
      background: rgba(11, 17, 32, 0.6);
    }
    .cmd-prompt { color: var(--color-accent); font-weight: 600; }
    .cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--color-card-foreground);
      font-size: 13px;
      line-height: 1;
    }
    .cmd-input::placeholder { color: rgba(203, 213, 225, 0.8); }

    .pane-head { margin-bottom: 18px; }
    .pane-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .metric-card { display: flex; flex-direction: column; gap: 10px; }
    .metric-card .m-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .metric-card .m-label { font-size: 13px; color: var(--color-muted-foreground); }
    .metric-card .m-value {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      color: var(--color-card-foreground);
      font-variant-numeric: tabular-nums;
    }
    .metric-card .m-value small { font-size: 12px; color: var(--color-muted-foreground); font-weight: 400; }
    .metric-card canvas { width: 100%; height: 52px; display: block; }

    .props {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .prop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
    }
    .prop-item .k { font-size: 13px; color: var(--color-muted-foreground); }
    .prop-item .v { font-family: var(--font-mono); font-size: 13px; color: var(--color-card-foreground); }

    .placeholder {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      color: var(--color-muted-foreground);
    }
    .placeholder svg { width: 44px; height: 44px; opacity: 0.6; }
    .placeholder h2 { font-size: 18px; color: var(--color-card-foreground); }

    /* ---------- File manager ---------- */
    .fm-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .fm-breadcrumb {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-muted-foreground);
    }
    .fm-breadcrumb .crumb { cursor: pointer; color: var(--color-muted-foreground); transition: color 0.15s ease; }
    .fm-breadcrumb .crumb:hover { color: var(--color-card-foreground); }
    .fm-breadcrumb .crumb.current { color: var(--color-card-foreground); font-weight: 500; }
    .fm-breadcrumb .sep { opacity: 0.5; }
    .fm-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .fm-list-wrap { padding: 6px; overflow-x: auto; }
    .fm-table { width: 100%; border-collapse: collapse; }
    .fm-table th, .fm-table td { text-align: left; padding: 10px 12px; font-size: 13px; }
    .fm-name > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
    .fm-table thead th {
      color: var(--color-muted-foreground);
      font-weight: 500;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .fm-table tbody tr { border-bottom: 1px solid rgba(255, 255, 255, 0.04); transition: background 0.15s ease; }
    .fm-table tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
    .fm-table tbody tr:last-child { border-bottom: none; }
    .fm-name {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      color: var(--color-card-foreground);
    }
    .fm-name:hover { color: #4ADE80; }
    .fm-name svg { width: 16px; height: 16px; flex-shrink: 0; }
    .fm-name .dir-ic { color: var(--color-warn); }
    .fm-name .file-ic { color: var(--color-muted-foreground); }
    .fm-cell { color: var(--color-muted-foreground); font-family: var(--font-mono); font-size: 12.5px; }
    .fm-ops { white-space: nowrap; text-align: right; }
    .fm-ops .btn { padding: 6px 9px; font-size: 12px; }
    .fm-ops .btn svg { width: 13px; height: 13px; }
    .fm-ops .ops-more { display: none; }
    .fm-ops-th { text-align: right !important; }
    .fm-empty { padding: 30px; text-align: center; }

    /* ---------- Context menu ---------- */
    .ctx-menu {
      position: fixed;
      z-index: 60;
      min-width: 170px;
      background: rgba(22, 28, 46, 0.97);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 11px;
      box-shadow: 0 18px 46px rgba(2, 6, 23, 0.6);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .ctx-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      color: var(--color-card-foreground);
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .ctx-item:hover { background: rgba(34, 197, 94, 0.14); color: #4ADE80; }
    .ctx-item.danger { color: #F87171; }
    .ctx-item.danger:hover { background: rgba(239, 68, 68, 0.16); color: #F87171; }
    .ctx-item svg { width: 15px; height: 15px; flex-shrink: 0; }
    .ctx-sep { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 4px 6px; }
    .ctx-menu[hidden] { display: none; }

    /* ---------- Modals ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal {
      width: 100%;
      max-width: 460px;
      max-height: 86vh;
      overflow: auto;
      background: #161c2e;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.6);
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .modal-head h3 { font-size: 16px; font-weight: 600; }
    .modal-close { color: var(--color-muted-foreground); font-size: 16px; width: 30px; height: 30px; border-radius: 8px; }
    .modal-close:hover { background: rgba(255, 255, 255, 0.06); color: var(--color-card-foreground); }
    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .prop-row { display: flex; justify-content: space-between; gap: 14px; font-size: 13px; }
    .prop-row .k { color: var(--color-muted-foreground); flex-shrink: 0; }
    .prop-row .v { text-align: right; word-break: break-all; }

    .perm-grid {
      display: grid;
      grid-template-columns: 70px repeat(3, 1fr);
      gap: 8px;
      align-items: center;
    }
    .perm-grid .pg-head { font-size: 12px; color: var(--color-muted-foreground); text-align: center; }
    .perm-grid .pg-group { font-size: 13px; color: var(--color-card-foreground); }
    .perm-bit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 7px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      font-size: 12px;
      color: var(--color-muted-foreground);
      transition: all 0.15s ease;
    }
    .perm-bit input { accent-color: var(--color-accent); cursor: pointer; }
    .perm-preview {
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      font-size: 13px;
      color: var(--color-card-foreground);
      text-align: center;
    }

    .editor-modal { max-width: 760px; }
    .editor-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .editor-name { font-size: 13px; word-break: break-all; }
    .editor-lang {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ADE80;
      flex-shrink: 0;
    }
    .editor-body { padding: 0; height: 420px; }
    .editor-body .CodeMirror { height: 100%; font-size: 13px; }
    .CodeMirror { background: #0b1120 !important; color: #e2e8f0 !important; }
    .modal-backdrop[hidden] { display: none; }

    @media (max-width: 1100px) {
      .terminal-col { width: 380px; }
    }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: auto; }
      .app-body { flex-direction: column; }
      .sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        padding: 8px 10px;
      }
      .sidebar-label { display: none; }
      .nav-item { white-space: nowrap; }
      .terminal-col { width: 100%; height: 320px; border-right: none; border-bottom: 1px solid var(--color-border); }
      .fm-ops .ops-extra { display: none; }
      .fm-ops .ops-more { display: inline-flex; }
      .fm-table thead th:nth-child(3),
      .fm-table thead th:nth-child(4),
      .fm-table tbody td:nth-child(3),
      .fm-table tbody td:nth-child(4) { display: none; }
      .fm-name > span:last-child { max-width: 110px; }
    }
    @media (max-width: 700px) {
      .topbar-actions .btn span { display: none; }
      .topbar-actions .btn { padding: 9px 11px; }
      .topbar-title .name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
  </style>

  <!-- Properties modal -->
  <div class="modal-backdrop" id="prop-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="文件属性">
      <div class="modal-head"><h3>文件属性</h3><button class="modal-close" data-close="prop-modal" aria-label="关闭">✕</button></div>
      <div class="modal-body">
        <div class="prop-row"><span class="k">名称</span><span class="v mono" id="prop-name">-</span></div>
        <div class="prop-row"><span class="k">大小</span><span class="v mono" id="prop-size">-</span></div>
        <div class="prop-row"><span class="k">创建时间</span><span class="v mono" id="prop-time">-</span></div>
        <div class="prop-row"><span class="k">权限</span><span class="v mono" id="prop-perms">-</span></div>
        <div class="prop-row"><span class="k">属性</span><span class="v mono" id="prop-type">-</span></div>
        <div class="prop-row"><span class="k">完整路径</span><span class="v mono" id="prop-path">-</span></div>
      </div>
      <div class="modal-foot"><button class="btn" data-close="prop-modal">关闭</button></div>
    </div>
  </div>

  <!-- Permissions modal -->
  <div class="modal-backdrop" id="perm-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="编辑文件权限">
      <div class="modal-head"><h3>编辑权限</h3><button class="modal-close" data-close="perm-modal" aria-label="关闭">✕</button></div>
      <div class="modal-body">
        <p class="muted" id="perm-target">-</p>
        <div class="perm-grid" id="perm-grid"></div>
        <div class="perm-preview mono" id="perm-preview">-rw-r--r--</div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close="perm-modal">取消</button>
        <button class="btn btn-success" id="perm-save">保存权限</button>
      </div>
    </div>
  </div>

  <!-- Code editor modal -->
  <div class="modal-backdrop" id="editor-modal" hidden>
    <div class="modal editor-modal" role="dialog" aria-modal="true" aria-label="代码编辑器">
      <div class="modal-head">
        <div class="editor-info">
          <span class="editor-name mono" id="editor-name">-</span>
          <span class="editor-lang" id="editor-lang">-</span>
        </div>
        <button class="modal-close" data-close="editor-modal" aria-label="关闭">✕</button>
      </div>
      <div class="editor-body"><textarea id="editor-text"></textarea></div>
      <div class="modal-foot">
        <button class="btn" data-close="editor-modal">取消</button>
        <button class="btn btn-success" id="editor-save">保存</button>
      </div>
    </div>
  </div>
