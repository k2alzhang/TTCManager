name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            artifact: ttcmanager-linux-x64
          - os: macos-latest
            target: node18-mac-x64
            artifact: ttcmanager-mac-x64
          - os: windows-latest
            target: node18-win-x64
            artifact: ttcmanager-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build single-file executable
        env:
          BUILD_TARGETS: ${{ matrix.target }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List binaries
        run: ls -la dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite: true
          body: |
            ## TTCManager — Minecraft 服务器管理面板

            单文件可执行，开箱即用。功能：服务器创建/启动/停止/重启、控制台命令、实时日志(WebSocket)、玩家管理、文件管理、FTP/SFTP、核心(Paper/Fabric/Purpur/原版)与插件在线下载、多服务器独立目录、Token 登录。

            ### v0.1.8 修复说明
            - 修复服务器列表**无法删除**（新增 DELETE 接口 + 列表删除按钮）。
            - 修复**下载文件不完整**：下载后校验 **sha256/sha1**，不匹配即删除并报错。
            - 新增**自动生成启动脚本** `start.sh` / `start.bat`（下载/上传核心后自动生成，可在文件管理中修改）。
            - 添加服务器页拆分：**自定义服务端**仅上传界面；**在线下载**只显示版本 + 自定义名称，带**实时进度条**，**下载完成才创建服务器**（失败自动回滚）。
            - 修复**文件管理下载**无法触发浏览器下载。

            ### 运行
            1. 下载对应平台的产物（Windows 为 `win-ttc-manager.exe`）。
            2. 双击运行，终端打印详细启动日志；用浏览器打开 `http://127.0.0.1:8080`。
            3. 首次访问设置管理员账号密码。数据保存在可执行文件同目录 `data/`（每台服务器独立子目录，防止冲突）。
            4. 修改端口：`PORT`/`HOST` 环境变量，或 `data/settings.json`。

            ### 产物
            - `linux-ttc-manager` — Linux x64
            - `mac-ttc-manager` — macOS x64
            - `win-ttc-manager.exe` — Windows x64
