name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            artifact: ttcmanager-linux-x64
          - os: macos-latest
            target: node18-mac-x64
            artifact: ttcmanager-mac-x64
          - os: windows-latest
            target: node18-win-x64
            artifact: ttcmanager-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build single-file executable
        env:
          BUILD_TARGETS: ${{ matrix.target }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List binaries
        run: ls -la dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite: true
          body: |
            ## TTCManager — Minecraft 服务器管理面板

            单文件可执行，开箱即用。功能：服务器创建/启动/停止/重启、控制台命令、实时日志(WebSocket)、实时占用监控(CPU/内存/网络/TPS/在线玩家)、玩家管理、文件管理、FTP/SFTP、核心(Paper/Fabric/Purpur/原版)与插件在线下载、多服务器独立目录、Token 登录。

            ### v0.1.0 说明
            - **在线下载原子安装**：核心先下载到临时目录并**完整校验**（Paper=官方 sha256、原版=官方 sha1、Purpur=官方 md5、Fabric/插件=zip 结构完整性校验），**校验通过才创建服务器**；失败不创建、自动清理。
            - **版本列表全部来自官方 API**，失败显示错误并可重试，不使用硬编码列表。
            - 添加服务器页拆分：**方式一 · 上传本地 jar** / **方式二 · 在线下载**（核心+版本+名称+实时进度条）。
            - **启动脚本自动生成** `start.sh` / `start.bat`：默认 `-Xmx2048M`（最大 2G、不强制初始内存），可在文件管理中手动修改。
            - **实时占用监控**：CPU/内存/网络后端每秒采样，TPS/在线玩家从服务器日志解析，WebSocket 实时推送。
            - 服务器可删除、文件管理可真实下载、详细启动日志（`TTC_LOG_LEVEL=info` 精简）。

            ### v0.1.1 修复说明
            - 修复**版本列表经常拉取失败**：官方 API 请求增加 **20 秒超时 + 自动重试 3 次**（网络瞬断自愈）。
            - 修复报错生硬：官方返回非 JSON（网络拦截/限流页）时改为**明确中文提示**，不再显示 `Unexpected token` 等原始错误。

            ### 运行
            1. 下载对应平台的产物（Windows 为 `win-ttc-manager.exe`）。
            2. 双击运行，终端打印详细启动日志；用浏览器打开 `http://127.0.0.1:8080`。
            3. 首次访问设置管理员账号密码。数据保存在可执行文件同目录 `data/`（每台服务器独立子目录，防止冲突）。
            4. 修改端口：`PORT`/`HOST` 环境变量，或 `data/settings.json`。

            ### 产物
            - `linux-ttc-manager` — Linux x64
            - `mac-ttc-manager` — macOS x64
            - `win-ttc-manager.exe` — Windows x64
