<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTCManager · 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      padding: 32px 30px;
      background: var(--color-card);
      border-radius: 16px;
      border: 1px solid var(--color-border);
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.12);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .auth-logo svg {
      width: 22px;
      height: 22px;
      color: var(--color-accent);
    }
    .auth-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .auth-sub {
      color: var(--color-muted-foreground);
      font-size: 13.5px;
      margin: 4px 0 22px;
    }
    .auth-field {
      margin-bottom: 14px;
    }
    .auth-field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--color-muted-foreground);
    }
    .auth-field .text-input {
      width: 100%;
    }
    .auth-error {
      min-height: 18px;
      color: #DC2626;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .auth-btn {
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 14.5px;
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card anim-in">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        <span class="auth-title" id="auth-title">登录</span>
      </div>
      <p class="auth-sub" id="auth-sub">输入管理员账号继续</p>
      <form id="auth-form" autocomplete="off">
        <div class="auth-field">
          <label for="username">用户名</label>
          <input class="text-input" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="auth-field">
          <label for="password">密码</label>
          <input class="text-input" id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="auth-field" id="confirm-field" hidden>
          <label for="confirm">确认密码</label>
          <input class="text-input" id="confirm" name="confirm" type="password" autocomplete="new-password" />
        </div>
        <div class="auth-error" id="auth-error"></div>
        <button class="btn btn-success auth-btn" id="submit-btn" type="submit">进入面板</button>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
